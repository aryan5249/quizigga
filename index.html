<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizigga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-box">
 
    <div class="counter">Question <span id="current-q">1</span> / 10</div>
 
    <div class="question-box">
      <p id="question-text">This is the first question text goes here?</p>
    </div>
 
    <div class="answers">
      <button class="answer-btn" data-option="A">
        <span class="option-label">A</span>
        <span class="option-text" id="option-a">Answer option one</span>
      </button>
 
      <button class="answer-btn" data-option="B">
        <span class="option-label">B</span>
        <span class="option-text" id="option-b">Answer option two</span>
      </button>
 
      <button class="answer-btn" data-option="C">
        <span class="option-label">C</span>
        <span class="option-text" id="option-c">Answer option three</span>
      </button>
 
      <button class="answer-btn" data-option="D">
        <span class="option-label">D</span>
        <span class="option-text" id="option-d">Answer option four</span>
      </button>
    </div>
 
  </div>
  <script src="script.js"></script>
</body>
</html>
